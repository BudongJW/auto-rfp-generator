llm:
  # LLM 보조 추출(설계서 7.3절 B). 모델 ID는 저장소에 두지 않는다: --llm-model 또는 RFPGEN_LLM_MODEL,
  # 없으면 Models API에서 가장 최근 Opus 계열을 고른다. effort·runs는 벤치마크로 조정한다(설계서 13장).
  tasks:
    value:
      guideline: {effort: medium, max_tokens: 16000, runs: 1}
      compliance: {effort: high, max_tokens: 32000, runs: 2}
      text_requirements: {effort: high, max_tokens: 32000, runs: 2}
      storyboard: {effort: high, max_tokens: 32000, runs: 1}
      section: {effort: high, max_tokens: 32000, runs: 1}
    status: user
    ref: "설계서 8.4절 시작값. runs=2는 같은 입력을 두 번 돌려 결과가 흔들리는 항목을 표시한다(Yu et al. 2026)"
  pricing_usd_per_mtok:
    # 비용 추정용 단가(백만 토큰당 달러). 모델 ID가 정확히 같거나 가장 긴 접두어가 맞는 줄을 쓴다.
    value:
      claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.2, cache_write: 5.0}
      claude-opus-5: {input: 5.0, output: 25.0, cache_read: 0.5, cache_write: 6.25}
      claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.1, cache_write: 2.5}
    status: provisional
    ref: "Anthropic 공개 단가(2026-11 기준, cache_write는 5분 캐시 = 입력의 1.25배). 바뀔 수 있으니 실제 청구는 Console에서 확인"
  excerpt_max_chars:
    value: 80000
    status: user
    ref: "과제당 RFP 발췌 상한(문자 수). 공개 RFP 404쪽(본문 37만 자)에서 과제별 발췌는 5.8만~6.5만 자였다"
