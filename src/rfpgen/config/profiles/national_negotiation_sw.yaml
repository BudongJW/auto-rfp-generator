# 국가 협상계약(SW·정보화) 기본 프로필 — 설계서 9장
#
# 각 값은 {value, status, ref} 형태다.
#   status: verified(원문 대조 완료) | provisional(조사 보고서 값, 원문 미대조) | user(제안값·사람이 정함)
# RFP에서 파싱한 값이 있으면 항상 그 값이 우선한다(G1 확정 후).
# provisional 항목은 설계서 부록 A에 따라 원문과 대조한 뒤 verified로 바꾼다.

profile: national_negotiation_sw
description: 국가 협상에 의한 계약 — SW 개발·유지관리, 정보화 용역

evaluation:
  tech_price_ratio:
    value: [90, 10]
    status: verified
    ref: "행정기관 및 공공기관 정보시스템 구축·운영 지침(행정안전부고시 제2025-1호) 제18조①: 기술능력평가 배점한도 90점. 같은 조②: 하드웨어 비중 50% 이상·추정가격 1억 원 미만 개발사업 등은 80점 가능. 조달청 협상에 의한 계약 제안서평가 세부기준(조달청지침 제379호) 제9조①: 정보화사업은 이 지침 제18조를 따름 — 원문 확인 2026-11-17, docs/analysis/m0-source-check.md"
  tech_quant_qual:
    value: [20, 70]
    status: provisional
    ref: "공고별 값(2025년 공고 R25BK00879799 예시). 협상에 의한 계약체결기준 제16조②는 기술능력 평가를 정량·정성으로 나누라고만 정하고 비율은 정하지 않음 — RFP 값 우선(원문 확인 2026-11-17, docs/analysis/m0-source-check.md)"
  tech_cutoff_pct:
    value: 85
    status: verified
    ref: "(계약예규) 협상에 의한 계약체결기준(재정경제부계약예규 제40호, 2026.1.2. 시행) 제8조①: 기술능력평가 점수가 기술능력평가분야 배점한도의 85% 이상인 자를 협상적격자로 선정 — 원문 확인 2026-11-17, docs/analysis/m0-source-check.md"
  max_points_per_area:
    value: 30
    status: verified
    ref: "소프트웨어 기술성 평가기준 지침(과학기술정보통신부고시 제2025-20호, 2025.4.30. 시행) 별표1 비고: 각 평가부문별 배점한도는 30점을 초과하지 못함(총 배점한도가 100점 이하이면 비율에 맞게 조정) — 원문 확인 2026-11-17, docs/analysis/m0-source-check.md"
  min_points:
    value: {상생협력: 5, 하도급: 5}
    status: verified
    ref: "같은 지침 별표1 비고: '상생협력', '하도급 계획 적정성' 각 배점한도 5점 이상. 대기업 참여제한 사업·민간투자형 SW사업은 상생협력 제외 가능, 하도급을 허용하지 않는 사업은 하도급 항목 제외 가능 — 원문 확인 2026-11-17, docs/analysis/m0-source-check.md"
  qualitative_grades:
    value: 5
    status: verified
    ref: "같은 지침 별표1 비고: 각 평가항목은 5등급 내외를 기준으로 절대 또는 상대평가 — 원문 확인 2026-11-17, docs/analysis/m0-source-check.md"

outline:
  is_sw_project:
    value: true
    status: user
    ref: "16장 Q1 확정: 첫 대상은 SW 개발·유지관리"
  fixed_chapters:
    value:
      - {key: 제안개요, title: 제안 개요, pages: 5, sections: [제안 배경 및 목적, 제안 범위, 제안의 특장점]}
      - {key: 제안업체일반, title: 제안업체 일반, pages: 5, sections: [입찰자 일반현황, 수행조직 및 업무분장, 핵심투입인력 및 이력사항]}
    status: user
    ref: "실제 RFP 관행(SPRi RFP 2018, KOSA 가이드북) — 쪽수는 제안값. '제안업체 일반'의 절 이름은 조달청 세부기준 별지 제5호서식 Ⅰ. 일반현황과 같게 함"
  default_template:
    value:
      - {key: 전략및방법론, title: 전략 및 방법론, sections: [사업 이해도, 추진 전략, 적용 기술, 표준 프레임워크 적용, 개발 방법론]}
      - {key: 기술및기능, title: 기술 및 기능, sections: [시스템 장비구성 요구사항, 기능 요구사항, 보안 요구사항, 데이터 요구사항, 시스템 운영 요구사항, 제약사항]}
      - {key: 성능및품질, title: 성능 및 품질, sections: [성능 요구사항, 품질 요구사항, 인터페이스 요구사항, 테스트 요구사항]}
      - {key: 프로젝트관리, title: 프로젝트 관리, sections: [관리방법론, 관리역량, 일정계획, 개발장비]}
      - {key: 프로젝트지원, title: 프로젝트 지원, sections: [품질보증, 시험운영, 교육훈련, 유지보수, 기밀보안, 비상대책]}
      - {key: 상생협력하도급, title: 상생협력 및 하도급 계획, sections: [상생협력 계획, 하도급 계획의 적정성]}
      - {key: 그밖의사항, title: 그 밖의 사항, sections: []}
    status: verified
    ref: "조달청 협상에 의한 계약 제안서평가 세부기준(조달청지침 제379호, 2026.1.26. 시행) [별지 제5호서식] 제안서 서식(예시: 소프트웨어개발, 유지관리사업)의 Ⅱ~Ⅶ과 장·절 이름 일치(제6조의2①: 입찰자는 별지 제5호서식에 따라 제안서 작성). Ⅰ. 일반현황은 fixed_chapters '제안업체 일반'. '상생협력 및 하도급 계획' 장은 별지 5에 없고 SW 기술성 평가기준 별표1 평가항목(각 5점 이상)에 대응하려고 더함 — 원문 확인 2026-11-17, docs/analysis/m0-source-check.md"
  mandatory_chapters:
    value: [상생협력하도급]
    status: verified
    ref: "SW 기술성 평가기준 지침 별표1: 상생협력·하도급 계획 적정성 각 5점 이상(제외 가능 사업은 min_points 참고) — 원문 확인 2026-11-17, docs/analysis/m0-source-check.md"

