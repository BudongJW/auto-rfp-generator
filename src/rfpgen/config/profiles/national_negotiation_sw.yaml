compliance:
  # 원문에 없어도 확인을 권하는 사유(origin=suggested). G1에서 사람이 채택해야 점검 규칙의 근거가 된다.
  # OpenBidKit_Yibiao의 '원문 명시 vs 경험상 권고' 분리를 한국 조달 관행으로 바꿨다(최대 5개).
  suggested:
    value:
      - {kind: 입찰무효, related_check: SUB, text: "가격입찰서와 제안서 중 하나라도 제출하지 않으면 입찰이 무효가 된다",
         basis: "공고 문구(NIA·서울지방조달청) — 국가계약법 시행규칙 제44조에는 명시 없음, 원문 미확인"}
      - {kind: 제출유의, related_check: SUB, text: "나라장터 임시저장 시 파일이 암호화되고, 최종 제출 후에는 수정·재제출할 수 없다",
         basis: "나라장터 이용안내 — 법령 아님, 원문 미확인"}
      - {kind: 평가제외, related_check: FACT, text: "제출 서류가 부정·허위로 밝혀지면 계약 전에는 협상적격자에서 제외되거나 낙찰자 결정이 취소되고, 계약 후에는 계약이 해제·해지될 수 있다",
         basis: "조달청 협상에 의한 계약 제안서평가 세부기준(조달청지침 제379호) 제10조⑬"}
      - {kind: 감점, related_check: LANG, text: "평가위원 과반수가 제안서·발표에 타 업체 비방이 있다고 평가하면 최종 기술능력평가 점수에서 0.1점을 감점하고, 제안서 제출 때 별지 제21·22호 서식을 낸다",
         basis: "같은 기준 제10조의9, 별표 26(부칙: 2026.6.30.까지 오프라인 평가에만 적용)"}
      - {kind: 감점, related_check: null, text: "입찰자·이해관계자가 평가위원을 사전접촉한 사실이 확인되면 종합점수(100점 기준)에서 5점을 감점한다",
         basis: "같은 기준 제14조의2①"}
    status: provisional
    ref: "항목별 basis 참고. 5개 중 3개(허위·비방·사전접촉)는 조달청지침 제379호 원문 확인, 2개(무효·임시저장)는 공고·이용안내 문구로 미확인 — 원문 확인 2026-11-17, docs/analysis/m0-source-check.md"

