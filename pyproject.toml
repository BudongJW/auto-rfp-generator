[project]
name = "rfpgen"
version = "0.1.0"
description = "나라장터·조달청 제안서 자동생성기 — M1 RFP 분석기"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "pyyaml>=6",
    "lxml>=5",
    "python-hwpx>=6.12,<7",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "anthropic>=1.0",
    "pikepdf>=9",
    "python-pptx>=1.0",
]

[project.scripts]
rfpgen = "rfpgen.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfpgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
